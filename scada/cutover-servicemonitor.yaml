# 2F CUTOVER — single-path telemetry (LOG-033 decision). Apply ONLY after the tag server has
# proven stable on the box (values match the sim's debug tap, quality GOOD, historian rows
# growing through at least one PS1 + PS5 run). Then, in this order:
#
#   kubectl apply -f scada/cutover-servicemonitor.yaml
#   kubectl -n plant delete servicemonitor plant-sim
#
# From that moment Prometheus's plant_* series come from the PLC-read tag path; plant-sim's
# /metrics remains as an UNSCRAPED debug tap (curl it directly to compare). Rollback = the
# reverse two commands. Grafana caveat: any panel charting plant_fault_active/plant_plc_connected
# (sim-plane meta, not PLC-readable) goes empty after cutover — check skn-plant panels and
# either keep those on the sim tap or drop them; the engine itself queries only the parity set.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tag-server
  namespace: plant
  labels: { release: prom }
spec:
  selector: { matchLabels: { app: tag-server } }
  namespaceSelector: { matchNames: [plant] }
  endpoints:
  - port: metrics
    interval: 5s
    # keep the tag server's OWN namespace/pod labels (they name plant ASSETS)
    honorLabels: true
