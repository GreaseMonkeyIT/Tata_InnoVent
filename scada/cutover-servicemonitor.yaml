# The SCADA read switch (LOG-033 decision, done in LOG-100). deploy/golive.sh applies this file.
# Prometheus reads every plant signal that a PLC reads from the tag server: the OpenPLC registers
# (temperatures, currents, rail volts, flow, pump health, throughput, trips, the supply water
# temperature, the compressor pressure reading) and the SCADA calculated tags (heat, trip limits,
# cooling shortfall). The plant-sim ServiceMonitor (plant/deploy.yaml) keeps only the instrument
# feeds that no PLC reads: the power meters, the managed switch, and the chiller relay contact.
# Rollback: kubectl -n plant delete servicemonitor tag-server, and remove the metricRelabelings
# block of the plant-sim ServiceMonitor.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tag-server
  namespace: plant
  labels: { release: prom }
spec:
  selector: { matchLabels: { app: tag-server } }
  namespaceSelector: { matchNames: [plant] }
  endpoints:
  - port: metrics
    interval: 5s
    # keep the tag server's OWN namespace/pod labels (they name plant ASSETS)
    honorLabels: true
