# The console preview (LOG-121, LOG-122, Dockerfile.preview): the static export over plain HTTP.
# The container publishes this port on the Tailscale address of forge only (deploy/console-preview.sh).
# It also proxies, on the same origin (no mixed content, no second exposed port):
#   /api/clock  the replay exporter's clock, so the console and Grafana show the same moment
#   /grafana/   the preview Grafana, which the console embeds for every graph
#   /api/live/plant/, /api/live/engine/   the live plant and its engine (LIVE=1), GET only
# The names resolve at request time through the Docker DNS, so nginx starts even when a container
# of the preview is down (the console then shows the plant recording without graphs).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /api/clock {
    set $replay http://visr-replay:9108;
    proxy_pass $replay/clock;
  }

  location /grafana/ {
    set $grafana http://visr-grafana:3000;
    proxy_pass $grafana;
    proxy_set_header Host $http_host;
  }

  # Grafana Live is a websocket (2026-10-22: without the upgrade the browser logs a failed handshake)
  location /grafana/api/live/ {
    set $grafana http://visr-grafana:3000;
    proxy_pass $grafana;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
  }

  # The live plant (2026-10-22, LIVE=1 deploy/console-preview.sh, live/README.md): the plant service
  # and the engine service run on forge itself and listen on the docker0 address only. GET only: a
  # fault comes from the operator's shell on forge, not from the console. Without the services the
  # console gets 502 here and plays the recording.
  location /api/live/plant/ {
    limit_except GET { deny all; }
    set $plant http://172.17.0.1:9110;
    rewrite ^/api/live/plant/(.*)$ /$1 break;
    proxy_pass $plant;
  }
  location /api/live/engine/ {
    limit_except GET { deny all; }
    set $engine http://172.17.0.1:9111;
    rewrite ^/api/live/engine/(.*)$ /$1 break;
    proxy_pass $engine;
  }

  # the plant recording is about 3 MB of JSON
  gzip on;
  gzip_types application/json application/javascript text/css;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # a new recording must reach the browser without a stale copy
  location /floor/ {
    add_header Cache-Control "no-cache";
  }

  # Static export: serve the requested file, its exported .html, or fall back to the app shell.
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
