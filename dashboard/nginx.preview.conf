# The console preview (LOG-121, Dockerfile.preview): the static export over plain HTTP. The
# container publishes this port on the Tailscale address of forge only (deploy/console-preview.sh).
# No API and no Grafana: the preview runs on the plant recording and the mock verdict.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # the plant recording is about 3 MB of JSON
  gzip on;
  gzip_types application/json application/javascript text/css;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # a new recording must reach the browser without a stale copy
  location /floor/ {
    add_header Cache-Control "no-cache";
  }

  # Static export: serve the requested file, its exported .html, or fall back to the app shell.
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
