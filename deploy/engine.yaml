# L3 correlation engine. Pulls the aggregator's /window + /events, runs the
# deterministic engine, serves the CausalGraph at /graph. Image skn/correlation-engine:v0.1.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: engine-memory-pvc
  namespace: aiops
  annotations:
    helm.sh/resource-policy: keep
  labels: { app: correlation-engine, tier: aiops }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: correlation-engine
  namespace: aiops
  labels: { app: correlation-engine, tier: aiops }
spec:
  replicas: 1
  selector: { matchLabels: { app: correlation-engine } }
  template:
    metadata:
      labels: { app: correlation-engine, tier: aiops }
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: engine
          image: localhost:5000/skn/correlation-engine:v0.1
          imagePullPolicy: Always   # local registry on the box (PIVOT_SETUP step 4)
          ports: [{ containerPort: 9100 }]
          env:
            - { name: WINDOW_URL, value: "http://aggregator.aiops.svc.cluster.local.:9000/window" }   # FQDN (trailing dot) skips the DNS search list -> immune to a Tailscale MagicDNS leak
            - { name: EVENTS_URL, value: "http://aggregator.aiops.svc.cluster.local.:9000/events" }
            # 2C' (LOG-033): plant victim families join the fan-out WITH the domain-witness patch
            # (never before it — without declared domains they'd be findings-only anyway, but the
            # rule is: enable together). psi_io stays primary (first).
            # SCENARIOS.md 4.2: field_latency joins as the net family (PS3). A family may name two
            # sources with "|": each member takes the first one it exports (chiller-1 has only its
            # cooling shortfall, so it can lead the loop in PS2).
            - { name: ENGINE_SIGNALS, value: "psi_io,psi_cpu,psi_mem,bus_voltage,coolant_temp,field_latency" }
            - { name: PLANT_FAMILIES, value: "bus_voltage:rail,coolant_temp:loop,field_latency:net" }
            - { name: PLANT_SOURCES,  value: "bus_voltage:current_draw,coolant_temp:heat_load|cooling_shortfall,field_latency:net_offered" }
            - { name: PLANT_INVERT,   value: "bus_voltage:400" }   # sag = 400 - V: higher = worse, engine-wide
            # SCENARIOS.md 4.5 (PS7): the common-mode rule. The source-leads rule cannot root a cause
            # ABOVE the plant, because an external dip has no machine load leading it. When every
            # member of one domain deviates together and no member load leads, the root is the domain
            # entity (incomer-1 for rail:incomer-1). Set COMMON_MODE=0 to turn the rule off.
            - { name: COMMON_MODE, value: "1" }
            - { name: COMMON_MODE_MIN_MEMBERS, value: "3" }
            - { name: COMMON_MODE_WINDOW_S, value: "15" }   # three grid steps at POLL_S=5
            - name: PLANT_DOMAINS     # the LOG-021/022 registry, now primary: declared shared media
              value: "rail:incomer-1=incomer-1,psu-a,psu-b,psu-c;rail:psu-a=press-1,press-2,cnc-1,qa-scanner-1,psu-a;rail:psu-b=conveyor-1,compressor-1,furnace-1,chiller-1,psu-b;loop:cool-1=press-1,press-2,cnc-1,furnace-1,chiller-1,cool-1;net:field-1=hmi-gw,plc-stamping,field-1"
            # 2H (FLEET.md section 9): run-time domains from the attesters. plant-sim publishes the live
            # rail and loop members (cell machines included). The tag server publishes plc: domains.
            # A failed fetch keeps the last good answer. The static PLANT_DOMAINS above always stay.
            - { name: DOMAIN_SOURCES, value: "http://plant-sim.plant.svc.cluster.local.:9200/domains,http://tag-server.plant.svc.cluster.local.:9300/domains" }
            - { name: FORECAST_PAIRS, value: "mem:mem_limit:leak,coolant_temp:temp_limit:trip" }   # OOM card + PS5 trip card
            - { name: MEMORY_DB, value: "/var/lib/skn/memory/l3-memory.db" }
            - { name: EDGE_ALPHA, value: "0.4" }
            - { name: EDGE_DECAY, value: "0.1" }
            - { name: EDGE_SHOW, value: "0.6" }
            - { name: EDGE_HIDE, value: "0.25" }
            - { name: DEV_K,     value: "3.5" }               # deviation-gate sensitivity (lowered from 4 for slightly faster confirm); raise toward 4-5 if idle flickers
            - { name: RESET_WINDOW, value: "24" }             # samples (~2min): the verdict clears this long after a storm ends (faster reset), not when it leaves the 15-min ring
            # The 24 h PS0 soak (2026-09-17/18) had 1 quiet line in 1,438: the baselines learned zeros
            # from a refilled ring, and a 90th-percentile gate flagged every compressor ON window.
            - { name: GATE_Q, value: "35" }                   # the tail must stay out of band for most of 2 min: a duty cycle stays quiet, a stuck load does not
            - { name: BASELINE_MIN_COVERAGE, value: "0.9" }   # a baseline learns only from a window at least 90 % full (never from zero padding)
            - { name: MAD_FLOOR_COOLANT_TEMP, value: "0.3" }  # deg C: a slow coolant wander of a few tenths of a degree is not an incident
            - { name: FORECAST_HORIZON_S, value: "900" }      # OOM early-warning: only warn when a pod's working_set will hit its memory limit within this window (lower if a slow climber false-fires)
            - { name: FORECAST_MIN_FRAC, value: "0.5" }       # OOM early-warning: only warn once working_set is past this fraction of the limit (box-verified. Do NOT go below 0.5: it re-admits false early cards). Mirrors the baked service.py default.
            - { name: TZ,        value: "Asia/Kolkata" }
          volumeMounts:
            - { name: memory, mountPath: /var/lib/skn/memory }
          readinessProbe:
            httpGet: { path: /healthz, port: 9100 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits:   { cpu: "1",  memory: 512Mi }
      volumes:
        - name: memory
          persistentVolumeClaim: { claimName: engine-memory-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: correlation-engine
  namespace: aiops
  labels: { app: correlation-engine }
spec:
  selector: { app: correlation-engine }
  ports: [{ name: http, port: 9100, targetPort: 9100 }]
