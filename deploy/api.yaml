# L4 API gateway: frontend-agnostic REST over L2/L3. Deployed to ns aiops.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: aiops
  labels: { app: api, tier: aiops }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api, tier: aiops }
    spec:
      serviceAccountName: api   # SA kept for future bounded RBAC (no Role binds to it today)
      containers:
        - name: api
          image: skn/api:v0.1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8088 }]
          env:
            - { name: ENGINE_URL,     value: "http://correlation-engine.aiops.svc:9100" }
            - { name: AGGREGATOR_URL, value: "http://aggregator.aiops.svc:9000" }
            - { name: PLANT_URL,      value: "http://plant-sim.plant.svc:9200" }   # plane-2 sim -> /api/plant
            - { name: OLLAMA_MODEL,   value: "gemma4:e4b-it-qat" }   # QAT 6.1GB (was e4b=11GB MXFP8 -> swapped the box); e2b-it-qat=4.3GB fits the 4GB GPU best
            # Ollama runs on the host (node IP; must listen on 0.0.0.0). Baked here so `kubectl apply`
            # no longer wipes it. Change to your node IP if it differs; empty -> template fallback.
            - { name: OLLAMA_HOST,    value: "http://192.168.1.239:11434" }
            - { name: TZ,             value: "Asia/Kolkata" }
            # 2E action gate: optional:true = safe rollout — Secret absent -> auth stays disabled
            # and /api/health says "auth: disabled" honestly. Create visr-auth to enforce.
            - name: VISR_OPERATOR_TOKEN
              valueFrom: { secretKeyRef: { name: visr-auth, key: operator-token, optional: true } }
            - { name: AUDIT_PATH,     value: "/data/audit.jsonl" }
          volumeMounts:
            - { name: audit, mountPath: /data }
          readinessProbe:
            httpGet: { path: /healthz, port: 8088 }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: 50m,  memory: 96Mi }
            limits:   { cpu: 250m, memory: 192Mi }
      volumes:
        # survives container restarts (not pod rescheduling) — single-node box, acceptable;
        # promoting the ledger to a PVC is a noted roadmap step, not a silent claim.
        - name: audit
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: aiops
  labels: { app: api }
spec:
  type: NodePort
  selector: { app: api }
  ports: [{ name: http, port: 8088, targetPort: 8088, nodePort: 30088 }]
---
# The api ServiceAccount. No Role binds to it today. PS-series faults are HTTP calls to
# plant-sim:9200, so they need no RBAC. The Stage-3 act loop will bind its bounded Role here.
apiVersion: v1
kind: ServiceAccount
metadata: { name: api, namespace: aiops }
