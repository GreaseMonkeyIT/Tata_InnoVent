# L4 API gateway: frontend-agnostic REST over L2/L3. Deployed to ns aiops.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: aiops
  labels: { app: api, tier: aiops }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api, tier: aiops }
    spec:
      serviceAccountName: api   # deploy/fleet.yaml binds Role fleet-manager to it (namespace fleet only)
      securityContext:              # LOG-095: non-root, the default seccomp profile
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: localhost:5000/skn/api:v0.1
          imagePullPolicy: Always   # local registry on the box (PIVOT_SETUP step 4)
          securityContext:            # LOG-095: no privilege escalation, no capabilities, read-only root
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 8088 }]
          env:
            - { name: ENGINE_URL,     value: "http://correlation-engine.aiops.svc:9100" }
            - { name: AGGREGATOR_URL, value: "http://aggregator.aiops.svc:9000" }
            - { name: PLANT_URL,      value: "http://plant-sim.plant.svc:9200" }   # plane-2 sim -> /api/plant
            - { name: OLLAMA_MODEL,   value: "gemma4:e4b-it-qat" }   # QAT 6.1GB (was e4b=11GB MXFP8 -> swapped the box); e2b-it-qat=4.3GB fits the 4GB GPU best
            # Ollama runs on the host (node IP; must listen on 0.0.0.0). Baked here so `kubectl apply`
            # no longer wipes it. Change to your node IP if it differs; empty -> template fallback.
            - { name: OLLAMA_HOST,    value: "http://192.168.1.239:11434" }
            - { name: TZ,             value: "Asia/Kolkata" }
            # 2E action gate: optional:true = safe rollout — Secret absent -> auth stays disabled
            # and /api/health says "auth: disabled" honestly. Create visr-auth to enforce.
            # LOG-095: Secrets arrive as files (a mounted volume), not as environment variables.
            - { name: VISR_OPERATOR_TOKEN_FILE, value: "/run/secrets/visr-auth/operator-token" }
            - { name: AUDIT_PATH,     value: "/data/audit.jsonl" }
            # 2H fleet + 3D act loop (FLEET.md section 10). Both keys come from Secret visr-fleet.
            # Without it, fleet changes and setpoint writes fail closed and /api/fleet says so.
            - { name: FLEET_ENROLL_KEY_FILE,  value: "/run/secrets/visr-fleet/enroll-key" }
            - { name: SCADA_WRITE_TOKEN_FILE, value: "/run/secrets/visr-fleet/scada-write-token" }
            - { name: SCADA_URL,         value: "http://tag-server.plant.svc.cluster.local:9300" }
            - { name: VPLC_IMAGE,        value: "localhost:5000/skn/vplc:v0.1" }
            - { name: TASKS_DIR,         value: "/tasks" }
            - { name: DERATE_TARGET_PCT, value: "55" }
            - { name: RELIEF_CHECK_S,    value: "60" }
            # SCENARIOS.md 5: the PS4A injector, and the integrity checks (a pass every RECONCILE_S s).
            # INTEGRITY_BACKGROUND "0" stops the checks. The PS4A and PS6 faults use SCADA_WRITE_TOKEN.
            - { name: EWS_URL,              value: "http://rogue-ews.plant.svc.cluster.local:8090" }
            - { name: INTEGRITY_BACKGROUND, value: "1" }
            - { name: RECONCILE_S,          value: "5" }
          volumeMounts:
            - { name: audit, mountPath: /data }
            - { name: tasks, mountPath: /tasks, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: visr-auth, mountPath: /run/secrets/visr-auth, readOnly: true }
            - { name: visr-fleet, mountPath: /run/secrets/visr-fleet, readOnly: true }
            - { name: display-bands, mountPath: /etc/visr/bands, readOnly: true }   # LOG-103
          readinessProbe:
            httpGet: { path: /healthz, port: 8088 }
            initialDelaySeconds: 3
          # LOG-099: 192Mi predates the incident tracker, the narrator, and the agent. The busy working
          # set is 100-133Mi. Past half the limit, the leak forecast fires on any climb. The limit is
          # about 3x the busy working set.
          resources:
            requests: { cpu: 50m,  memory: 128Mi }
            limits:   { cpu: 250m, memory: 384Mi, ephemeral-storage: 256Mi }
      volumes:
        # survives container restarts (not pod rescheduling) — single-node box, acceptable;
        # promoting the ledger to a PVC is a noted roadmap step, not a silent claim.
        - name: audit
          emptyDir: {}
        - name: tasks        # the vPLC task library, created by `skctl up --components engine`
          configMap: { name: vplc-tasks, optional: true }
        - name: tmp
          emptyDir: {}
        - name: visr-auth    # optional: without it, auth stays disabled and /api/health says so
          secret: { secretName: visr-auth, optional: true }
        - name: visr-fleet   # optional: without it, fleet changes and setpoint writes fail closed
          secret: { secretName: visr-fleet, optional: true }
        # LOG-103: the throughput range of each machine, learned over the PS0 soak at the baseline lock
        # (deploy/engine-baselines.sh). Optional: without it, the console uses its fixed bands.
        - name: display-bands
          configMap: { name: display-bands, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: aiops
  labels: { app: api }
spec:
  # LOG-095: ClusterIP. The console reaches the api through the dashboard (TLS and the login). The box
  # scripts find the ClusterIP with kubectl. Port 30088 on the node is closed.
  type: ClusterIP
  selector: { app: api }
  ports: [{ name: http, port: 8088, targetPort: 8088 }]
---
# The api ServiceAccount. deploy/fleet.yaml binds the Role fleet-manager to it, in namespace fleet
# only (2H). PS-series faults are HTTP calls to plant-sim:9200, rogue-ews:8090, and tag-server:9300.
# They need no RBAC.
apiVersion: v1
kind: ServiceAccount
metadata: { name: api, namespace: aiops }
---
# LOG-088: Prometheus scrapes the verdict series from GET /metrics (api/metrics.py) every 5 s. The
# series name plant assets with the label "asset", so honorLabels stays off. Release label "prom"
# matches the kube-prometheus-stack serviceMonitorSelector.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-verdict
  namespace: aiops
  labels: { release: prom }
spec:
  selector: { matchLabels: { app: api } }
  namespaceSelector: { matchNames: [aiops] }
  endpoints:
  - port: http
    path: /metrics
    interval: 5s
