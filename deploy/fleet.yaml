# 2H virtual PLC fleet (FLEET.md section 12). Apply after the Secrets block in PIVOT_SETUP.md step 5.0b.
#   - namespace fleet, where every virtual PLC runs
#   - a Role that lets ONLY the api ServiceAccount manage PLC objects in fleet (least privilege)
#   - the base PLC plc-stamping: the process controller of press-1 and press-2 (Siemens S7-1200
#     profile, task stamping-line). OpenPLC stays the separate trip interlock, as in a real plant.
#   - LOG-100: plc-utilities (compressor-1, chiller-1), plc-machining (cnc-1), and plc-furnace
#     (furnace-1). Each has its device token Secret <name>-token (deploy/plc-tokens.sh).
#   - a ServiceMonitor for the tag server path /metrics/fleet (vplc_* and scada_* only, never plant_*)
---
apiVersion: v1
kind: Namespace
metadata:
  name: fleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-manager
  namespace: fleet
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-fleet-manager
  namespace: fleet
subjects:
  - kind: ServiceAccount
    name: api
    namespace: aiops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plc-stamping
  namespace: fleet
  labels: { app: vplc, visr/plc: plc-stamping, visr/profile: siemens-s7-1200, visr/managed: static }
spec:
  replicas: 1
  selector: { matchLabels: { visr/plc: plc-stamping } }
  template:
    metadata:
      labels: { app: vplc, visr/plc: plc-stamping, visr/profile: siemens-s7-1200, visr/managed: static }
    spec:
      automountServiceAccountToken: false
      securityContext:              # LOG-095: non-root, the default seccomp profile
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
        # LOG-095: a non-root process may bind S7comm port 102. A safe, namespaced sysctl.
        sysctls: [{ name: net.ipv4.ip_unprivileged_port_start, value: "0" }]
      containers:
        - name: vplc
          image: localhost:5000/skn/vplc:v0.1
          imagePullPolicy: Always   # local registry on the box (PIVOT_SETUP step 4)
          securityContext:            # LOG-095: no privilege escalation, no capabilities, read-only root
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - { name: PLC_NAME, value: "plc-stamping" }
            - { name: PROFILE, value: "siemens-s7-1200" }
            - { name: TASK_NAME, value: "stamping-line" }     # the baked library task
            - { name: TASK_DIR, value: "/task" }              # a loaded task (ConfigMap) takes priority
            - { name: TZ, value: "Asia/Kolkata" }
            - { name: DEVICE_TOKEN_FILE, value: "/run/secrets/device/token" }   # LOG-095: a file
          ports:
            - { name: s7comm, containerPort: 102 }
            - { name: field, containerPort: 5020 }
            - { name: control, containerPort: 8080 }
          volumeMounts:
            - { name: task, mountPath: /task, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: device, mountPath: /run/secrets/device, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { cpu: 250m, memory: 128Mi, ephemeral-storage: 128Mi }
      volumes:
        - name: task
          configMap: { name: plc-stamping-task, optional: true }
        - name: tmp
          emptyDir: {}
        - name: device
          secret: { secretName: plc-stamping-token }
---
apiVersion: v1
kind: Service
metadata:
  name: plc-stamping
  namespace: fleet
  labels: { app: vplc, visr/plc: plc-stamping }
spec:
  selector: { visr/plc: plc-stamping }
  ports:
    - { name: s7comm, port: 102, targetPort: 102 }
    - { name: field, port: 5020, targetPort: 5020 }
    - { name: control, port: 8080, targetPort: 8080 }
---
