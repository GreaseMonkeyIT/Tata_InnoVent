---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tag-server-fleet
  namespace: plant
  labels: { release: prom }
spec:
  selector: { matchLabels: { app: tag-server } }
  namespaceSelector: { matchNames: [plant] }
  endpoints:
    - port: metrics
      path: /metrics/fleet
      interval: 5s
      honorLabels: true      # keep namespace="fleet", pod="<plc>" from the tag server
